spring.application.name=spring-boot-ecommerce
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:ecommerceapp}
spring.datasource.password=${DB_PASSWORD:ecommerceapp}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.data.rest.base-path=/api

allowed.origins=https://localhost:4200

spring.data.rest.detection-strategy=annotated

# Auth0 / Okta issuer, e.g. https://dev-xxxxxx.us.auth0.com/ (set via environment variable)
okta.oauth2.issuer=${OKTA_OAUTH2_ISSUER:https://your-auth0-domain.example.com/}
# okta.oauth2.audience=... (only if you set one in Auth0)

#####
#
# HTTPS configuration
#
#####

# Server web port
#server.port=8443

server.port=9898

# Enable HTTPS support (only accept HTTPS requests)
server.ssl.enabled=true

# Alias that identifies the key in the key store
server.ssl.key-alias=luv2code

# Keystore location
server.ssl.key-store=classpath:luv2code-keystore.p12

# Keystore password
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}

# Keystore format
server.ssl.key-store-type=PKCS12

#####
#
# Payment Processing with stripe
#
#####
# Stripe secret key (test mode), supplied via environment variable - never commit a real key
stripe.key.secret=${STRIPE_SECRET_KEY:sk_test_replace_me}
